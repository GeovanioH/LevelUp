services:
  postgres:
    image: postgres:16-alpine
    container_name: levelup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-levelup_master}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-levelup_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-levelup_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-levelup_master} -d ${POSTGRES_DB:-levelup_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: levelup_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
