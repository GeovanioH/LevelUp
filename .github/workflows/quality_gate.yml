name: LevelUp Sovereign Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  qualification-pipeline:
    name: Exécution du Cahier de Recette Industriel (Quality Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: levelup_ci_db
          POSTGRES_USER: levelup_ci
          POSTGRES_PASSWORD: ci_secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupération du Code Source (Checkout)
        uses: actions/checkout@v4

      - name: Configuration de pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.16.1

      - name: Configuration de l'Environnement Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Installation des Dépendances
        run: pnpm install --frozen-lockfile

      - name: Étape 1 - Linting & Typechecking Stricts
        run: |
          pnpm lint
          pnpm typecheck

      - name: Préparation BDD CI (Prisma Generate & Migrate)
        env:
          DATABASE_URL: postgresql://levelup_ci:ci_secret_password@localhost:5432/levelup_ci_db?schema=public
        run: pnpm --filter @levelup/database db:generate

      - name: Étape 2 - Exécution de 100 % des Suites Vitest
        env:
          DATABASE_URL: postgresql://levelup_ci:ci_secret_password@localhost:5432/levelup_ci_db?schema=public
          REDIS_URL: redis://localhost:6379
        run: pnpm test:all

      - name: Étape 3 - Scan de Vulnérabilités de Sécurité (Trivy / Audit)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Non-blocking in CI sandbox if offline

      - name: Étape 4 - Audit d'Intégrité Documentaire (12 Fichiers >= 100 Ko)
        run: pnpm tsx scripts/verify_doc_sizes.ts
